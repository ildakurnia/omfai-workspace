name: Deploy Frontend to FTP

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  web-deploy:
    name: Build and Deploy Next.js Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Next.js Static Files
      run: |
        cd frontend
        npm run build

    - name: Prepare Dual HTML Resolution (Direct & Directory Index)
      run: |
        find frontend/out -name "*.html" -not -name "index.html" -not -name "404.html" | while read file; do
          dir="${file%.html}"
          mkdir -p "$dir"
          cp "$file" "$dir/index.html"
          echo "Prepared $file -> $dir/index.html"
        done

    - name: Deploy to FTP Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: frontend/out/
        server-dir: /frontend/out/ # Relatif jika akun FTP Anda sudah dikunci di dalam folder public_html
